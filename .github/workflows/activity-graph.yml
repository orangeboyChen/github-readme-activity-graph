name: Publish activity graph

on:
    schedule:
        - cron: '*/30 * * * *'
    workflow_dispatch:

concurrency:
    group: activity-graph-output
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    publish:
        runs-on: ubuntu-latest
        env:
            GRAPH_USERNAME: ${{ vars.GRAPH_USERNAME || github.repository_owner }}
            TOKEN: ${{ secrets.TOKEN || github.token }}
        steps:
            - name: Check out source
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Generate SVG
              env:
                  GRAPH_OUTPUT_DIR: ${{ runner.temp }}/activity-graph
              run: |
                  npm run build
                  node dist/generateStaticGraph.js

            - name: Check whether the graph changed
              id: changes
              env:
                  GENERATED_GRAPH_DIR: ${{ runner.temp }}/activity-graph
              run: |
                  git fetch --no-tags origin output:refs/remotes/origin/output || true
                  changed=true
                  rm -rf "$RUNNER_TEMP/previous-activity-graph"
                  mkdir -p "$RUNNER_TEMP/previous-activity-graph"
                  if git archive refs/remotes/origin/output | tar -x -C "$RUNNER_TEMP/previous-activity-graph" 2>/dev/null; then
                      if diff -qr "$GENERATED_GRAPH_DIR" "$RUNNER_TEMP/previous-activity-graph" >/dev/null; then
                          changed=false
                      fi
                  fi
                  echo "changed=$changed" >> "$GITHUB_OUTPUT"

            - name: Publish output branch
              if: steps.changes.outputs.changed == 'true'
              env:
                  GENERATED_GRAPH_DIR: ${{ runner.temp }}/activity-graph
              run: |
                  git config user.name github-actions[bot]
                  git config user.email 41898282+github-actions[bot]@users.noreply.github.com
                  git switch --orphan generated-output
                  git clean -fdx
                  cp "$GENERATED_GRAPH_DIR"/*.svg .
                  git add .
                  git commit -m "chore: update activity graphs"
                  git push --force origin HEAD:output
